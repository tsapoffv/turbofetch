org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP добавляет сгенерированные Kotlin-исходники через kotlin.sourceSets,
# что AGP 9 (встроенный Kotlin) запрещает. Разрешаем обратно.
android.disallowKotlinSourceSets=false

# Kotlin встроен в AGP 9 (версия 2.2.10), поэтому отдельный плагин
# org.jetbrains.kotlin.android не подключаем — AGP его запрещает.
# Версии kotlin-плагинов (compose/serialization) и KSP в gradle/libs.versions.toml
# обязаны совпадать с этой версией.

kotlin.code.style=official
